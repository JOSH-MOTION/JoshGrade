[package]
name = "grade-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "joshgrade-cli"
path = "src/main.rs"

[dependencies]
rawler = "*"
grade-core = { path = "../grade-core" }
rayon = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[bin]]
name = "gradefit"
path = "src/bin/gradefit.rs"
